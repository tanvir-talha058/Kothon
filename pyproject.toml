[project]
name = "kothon"
version = "0.2.0"
description = "Offline Bangla/English/Banglish voice typing for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "vosk==0.3.45",
    "sherpa-onnx==1.13.4",
    "numpy==2.3.5",
    "sounddevice==0.5.5",
    "pywebview==6.2.1",
    "keyboard==0.13.5",
    "pystray==0.19.5",
    "Pillow==11.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines in the transliteration/word tables are clearer unwrapped
]
