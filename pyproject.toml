[project]
name = "kothon"
version = "0.2.0"
description = "Offline Bangla/English/Banglish voice typing for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines in the transliteration/word tables are clearer unwrapped
]
