<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kothon</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:        #0b100d;
  --panel:     #10171310;
  --raise:     rgba(255,255,255,0.035);
  --border:    rgba(255,255,255,0.07);
  --jade:      #3dd68c;
  --jade-dim:  #1e6b4f;
  --rec:       #f2555a;
  --rec-deep:  #a1272c;
  --amber:     #f5a524;
  --text:      #edf2ef;
  --muted:     #8ba69a;
  --faint:     #4a5c54;
  --wave-faint: rgba(255,255,255,0.10);
}

:root[data-theme="day"] {
  --bg:        #f1f5f2;
  --raise:     rgba(9,32,21,0.05);
  --border:    rgba(9,32,21,0.13);
  --jade:      #14804e;
  --jade-dim:  #9fc7b2;
  --rec:       #d0342c;
  --rec-deep:  #c22b30;
  --amber:     #9a6b0a;
  --text:      #17211b;
  --muted:     #52665c;
  --faint:     #8a998f;
  --wave-faint: rgba(9,32,21,0.15);
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Nirmala UI', system-ui, sans-serif;
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* Soft vignette so the flat ink background has depth without decoration */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(61,214,140,0.05), transparent 55%),
    radial-gradient(140% 100% at 50% 115%, rgba(0,0,0,0.5), transparent 60%);
}
:root[data-theme="day"] body::before {
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(20,128,78,0.06), transparent 55%),
    radial-gradient(140% 100% at 50% 115%, rgba(9,32,21,0.08), transparent 60%);
}

.app { position: relative; z-index: 1; width: 100%; height: 100vh; }
.full-view { display: flex; flex-direction: column; width: 100%; height: 100%; }
.mini-view { display: none; }
.app.compact .full-view { display: none; }
.app.compact .mini-view { display: flex; }

/* ── Load-in orchestration (plays once) ── */
.titlebar, .status-strip, .mic-section, .live-box, .msg, .lang-section, .footer {
  animation: rise 0.5s cubic-bezier(0.22,1,0.36,1) both;
}
.status-strip { animation-delay: 0.05s; }
.mic-section  { animation-delay: 0.10s; }
.live-box     { animation-delay: 0.16s; }
.msg          { animation-delay: 0.20s; }
.lang-section { animation-delay: 0.24s; }
.footer       { animation-delay: 0.28s; }
@keyframes rise { from { opacity: 0; transform: translateY(7px); } }

/* ── Title bar (drag region) ── */
.titlebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 14px 10px 18px;
  -webkit-app-region: drag; app-region: drag;
  flex-shrink: 0;
}
.wordmark { display: flex; align-items: baseline; gap: 10px; }
.wordmark .bn {
  font-family: 'Nirmala UI', 'Segoe UI', sans-serif;
  font-size: 24px; font-weight: 600; line-height: 1;
  letter-spacing: 0.01em; color: var(--text);
}
.wordmark .latin {
  font-family: 'Cascadia Mono', Consolas, monospace;
  font-size: 10px; letter-spacing: 0.24em; color: var(--faint);
  text-transform: uppercase; white-space: nowrap;
}
.win-controls { display: flex; gap: 6px; -webkit-app-region: no-drag; app-region: no-drag; }
.win-btn {
  width: 27px; height: 27px; border: none; border-radius: 7px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: transparent; color: var(--faint);
  font-size: 13px; line-height: 1; transition: background 0.15s, color 0.15s;
}
.win-btn:hover   { background: var(--raise); color: var(--text); }
.win-btn.x:hover { background: rgba(242,85,90,0.16); color: var(--rec); }
.win-btn:focus-visible { outline: 1.5px solid var(--jade); outline-offset: 1px; }
.win-btn .moon-ico { display: none; }
:root[data-theme="day"] .win-btn .sun-ico  { display: none; }
:root[data-theme="day"] .win-btn .moon-ico { display: block; }

/* ── Status strip ── */
.status-strip {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 18px; flex-shrink: 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--jade); box-shadow: 0 0 6px rgba(61,214,140,0.5);
  flex-shrink: 0; transition: background 0.25s, box-shadow 0.25s;
}
.dot.listening { background: var(--rec); box-shadow: 0 0 8px rgba(242,85,90,0.7); animation: pulse 1.3s ease-in-out infinite; }
.dot.busy      { background: var(--amber); box-shadow: 0 0 6px rgba(245,165,36,0.5); }
.dot.error     { background: var(--amber); box-shadow: 0 0 6px rgba(245,165,36,0.6); }
@keyframes pulse { 50% { opacity: 0.35; } }
.status-text { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); transition: color 0.25s; }
.status-text.listening { color: var(--rec); }
.status-text.error     { color: var(--amber); }
.status-text.done      { color: var(--jade); }
.timer {
  margin-left: auto;
  font-family: 'Cascadia Mono', Consolas, monospace;
  font-size: 12px; color: var(--faint);
  font-variant-numeric: tabular-nums;
  transition: color 0.25s;
}
.timer.on { color: var(--rec); }

/* ── Mic section ── */
.mic-section {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px; padding: 6px 18px 0; min-height: 0;
}
.mic-wrap { position: relative; width: 128px; height: 128px; flex-shrink: 0; }

/* Live level ring — stroke driven by RMS from Python */
.level-ring { position: absolute; inset: 0; transform: rotate(-90deg); pointer-events: none; }
.level-ring .track { fill: none; stroke: var(--border); stroke-width: 2; }
.level-ring .fill  {
  fill: none; stroke: var(--jade); stroke-width: 2.5; stroke-linecap: round;
  stroke-dasharray: 377; stroke-dashoffset: 377;
  transition: stroke-dashoffset 0.12s linear, stroke 0.3s;
}
.mic-wrap.listening .level-ring .fill { stroke: var(--rec); }

.mic-btn {
  position: absolute; inset: 14px;
  border-radius: 50%; border: 1px solid var(--border); cursor: pointer;
  background: linear-gradient(160deg, #17211c, #10171310);
  box-shadow: 0 10px 28px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  display: flex; align-items: center; justify-content: center;
  color: var(--jade);
  transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s, background 0.25s, color 0.25s;
}
.mic-btn:hover  { transform: scale(1.04); box-shadow: 0 14px 34px rgba(0,0,0,0.6), 0 0 24px rgba(61,214,140,0.12), inset 0 1px 0 rgba(255,255,255,0.07); }
.mic-btn:active { transform: scale(0.95); }
.mic-btn:focus-visible { outline: 2px solid var(--jade); outline-offset: 3px; }
.mic-wrap.listening .mic-btn {
  background: linear-gradient(160deg, var(--rec-deep), #6e181c);
  border-color: rgba(242,85,90,0.5); color: #fff;
  box-shadow: 0 10px 30px rgba(161,39,44,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
}
.mic-wrap.listening .mic-btn:focus-visible { outline-color: var(--rec); }
:root[data-theme="day"] .mic-btn {
  background: linear-gradient(160deg, #ffffff, #e7efe9);
  box-shadow: 0 8px 22px rgba(23,33,27,0.16), inset 0 1px 0 #fff;
}
:root[data-theme="day"] .mic-btn:hover {
  box-shadow: 0 12px 28px rgba(23,33,27,0.22), 0 0 22px rgba(20,128,78,0.12), inset 0 1px 0 #fff;
}
:root[data-theme="day"] .mic-wrap.listening .mic-btn {
  background: linear-gradient(160deg, #de3e36, #b7231f);
  border-color: rgba(208,52,44,0.5); color: #fff;
  box-shadow: 0 10px 26px rgba(194,43,48,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
}
.mic-svg  { display: block; }
.stop-svg { display: none; }
.mic-wrap.listening .mic-svg  { display: none; }
.mic-wrap.listening .stop-svg { display: block; }

/* Scrolling waveform history */
.wave-canvas { width: 300px; height: 56px; flex-shrink: 0; }

/* ── Transcript ── */
.live-box {
  margin: 0 16px; flex-shrink: 0;
  background: var(--raise);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 12px 10px;
  transition: border-color 0.3s;
}
.live-box.recording { border-color: rgba(242,85,90,0.25); }
.live-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.live-label {
  font-family: 'Cascadia Mono', Consolas, monospace;
  font-size: 9px; letter-spacing: 0.22em; color: var(--faint); text-transform: uppercase;
}
.copy-btn {
  border: none; border-radius: 5px; cursor: pointer;
  padding: 3px 8px; font-size: 10px;
  font-family: 'Cascadia Mono', Consolas, monospace; letter-spacing: 0.08em;
  background: transparent; color: var(--faint);
  transition: background 0.15s, color 0.15s;
}
.copy-btn:hover { background: var(--raise); color: var(--text); }
.copy-btn.ok    { color: var(--jade); }
.copy-btn:focus-visible { outline: 1.5px solid var(--jade); outline-offset: 1px; }
.live-text {
  min-height: 44px; max-height: 66px; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--jade-dim) transparent;
  font-size: 13.5px; line-height: 1.65; word-break: break-word; user-select: text;
}
.live-text::-webkit-scrollbar { width: 3px; }
.live-text::-webkit-scrollbar-thumb { background: var(--jade-dim); border-radius: 2px; }
.live-text.empty::before { content: attr(data-placeholder); color: var(--faint); font-size: 12.5px; }
#liveConfirmed { color: var(--text); }
#liveConfirmed .seg { animation: seg-in 0.45s ease both; }
@keyframes seg-in { from { opacity: 0; } }
.word-count { color: var(--faint); text-transform: none; letter-spacing: 0.05em; }
#livePartial   { color: var(--muted); }
.live-cursor {
  display: none; width: 2px; height: 14px;
  background: var(--rec); border-radius: 1px;
  margin-left: 2px; vertical-align: text-bottom;
  animation: cur-blink 0.9s step-end infinite;
}
.live-box.recording .live-cursor { display: inline-block; }
@keyframes cur-blink { 50% { opacity: 0; } }

/* ── Status message ── */
.msg {
  font-size: 12px; color: var(--muted); text-align: center;
  line-height: 1.55; padding: 9px 26px 2px;
  min-height: 38px; transition: color 0.25s; flex-shrink: 0;
}
.msg.success { color: var(--jade); }
.msg.error   { color: var(--amber); }
@keyframes msg-in { from { opacity: 0; } }

/* ── Language selector ── */
.lang-section { padding: 8px 16px 12px; flex-shrink: 0; }
.lang-rail {
  display: flex; gap: 4px;
  background: var(--raise); padding: 4px; border-radius: 10px;
  border: 1px solid var(--border);
}
.lang-pill {
  flex: 1; padding: 8px 4px; border: 1px solid transparent; border-radius: 7px;
  font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  background: transparent; color: var(--muted);
  letter-spacing: 0.01em; transition: background 0.18s, color 0.18s, border-color 0.18s;
}
.lang-pill:hover:not(.active):not(:disabled) { background: rgba(255,255,255,0.05); color: var(--text); }
.lang-pill.active { background: #14251d; border-color: rgba(61,214,140,0.35); color: var(--jade); }
:root[data-theme="day"] .lang-pill.active { background: #dfece4; border-color: rgba(20,128,78,0.35); }
.lang-pill:disabled { opacity: 0.4; cursor: default; }
.lang-pill:focus-visible { outline: 1.5px solid var(--jade); outline-offset: 1px; }

/* ── Footer ── */
.footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 18px 13px; border-top: 1px solid var(--border); flex-shrink: 0;
  font-family: 'Cascadia Mono', Consolas, monospace;
}
.model-tag {
  font-size: 10px; color: var(--faint);
  max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hotkey-tag { font-size: 10px; color: var(--faint); letter-spacing: 0.06em; }
.hotkey-tag b { color: var(--muted); font-weight: 400; }

/* ── Mini bar — compact floating dock ── */
.mini-view {
  align-items: center; gap: 9px;
  width: 100%; height: 100%;
  padding: 0 10px 0 14px;
  -webkit-app-region: drag; app-region: drag;
  animation: rise 0.35s cubic-bezier(0.22,1,0.36,1) both;
}
.mini-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--jade);
  box-shadow: 0 0 6px rgba(61,214,140,0.5); flex-shrink: 0;
  transition: background 0.25s, box-shadow 0.25s;
}
.mini-dot.listening { background: var(--rec); box-shadow: 0 0 8px rgba(242,85,90,0.7); animation: pulse 1.3s ease-in-out infinite; }
.mini-dot.error { background: var(--amber); box-shadow: 0 0 6px rgba(245,165,36,0.6); }
.mini-mic {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer;
  background: linear-gradient(160deg, #17211c, #10171310);
  display: flex; align-items: center; justify-content: center; color: var(--jade);
  flex-shrink: 0; transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), background 0.25s, color 0.25s, border-color 0.25s;
  -webkit-app-region: no-drag; app-region: no-drag;
}
.mini-mic:hover  { transform: scale(1.08); }
.mini-mic:active { transform: scale(0.92); }
.mini-mic:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
.mini-mic .stop-svg { display: none; }
.mini-view.listening .mini-mic {
  background: linear-gradient(160deg, var(--rec-deep), #6e181c);
  border-color: rgba(242,85,90,0.5); color: #fff;
}
.mini-view.listening .mini-mic .mic-svg  { display: none; }
.mini-view.listening .mini-mic .stop-svg { display: block; }
:root[data-theme="day"] .mini-mic {
  background: linear-gradient(160deg, #ffffff, #e7efe9);
  box-shadow: 0 4px 12px rgba(23,33,27,0.14);
}
:root[data-theme="day"] .mini-view.listening .mini-mic {
  background: linear-gradient(160deg, #de3e36, #b7231f);
  border-color: rgba(208,52,44,0.5); color: #fff;
}
.mini-wave { flex: 1; min-width: 0; width: 100%; height: 26px; }
.mini-timer {
  font-family: 'Cascadia Mono', Consolas, monospace;
  font-size: 10px; color: var(--faint); flex-shrink: 0;
  min-width: 30px; text-align: right; font-variant-numeric: tabular-nums;
}
.mini-expand {
  width: 22px; height: 22px; border: none; border-radius: 6px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: transparent; color: var(--faint); flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
  -webkit-app-region: no-drag; app-region: no-drag;
}
.mini-expand:hover { background: var(--raise); color: var(--text); }
.mini-expand:focus-visible { outline: 1.5px solid var(--jade); outline-offset: 1px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div class="app" id="appRoot">

<div class="full-view" id="fullView">

  <!-- Title bar -->
  <div class="titlebar">
    <div class="wordmark">
      <span class="bn">কথন</span>
      <span class="latin">Kothon · offline</span>
    </div>
    <div class="win-controls">
      <button class="win-btn" id="compactBtn" onclick="toggleCompact()" title="Collapse to mini bar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button class="win-btn" id="themeBtn" onclick="toggleTheme()" title="Switch day / night mode">
        <svg class="sun-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="win-btn"   onclick="minWin()"   title="Minimize to tray">&#8722;</button>
      <button class="win-btn x" onclick="closeWin()" title="Close">&#10005;</button>
    </div>
  </div>

  <!-- Status strip -->
  <div class="status-strip">
    <div class="dot" id="dot"></div>
    <span class="status-text" id="statusText">Ready</span>
    <span class="timer" id="timer">00:00</span>
  </div>

  <!-- Mic + waveform -->
  <div class="mic-section">
    <div class="mic-wrap" id="micWrap">
      <svg class="level-ring" viewBox="0 0 128 128">
        <circle class="track" cx="64" cy="64" r="60"/>
        <circle class="fill" id="ringFill" cx="64" cy="64" r="60"/>
      </svg>
      <button class="mic-btn" id="micBtn" onclick="toggleListen()" title="Start or stop dictation (Ctrl+Shift+V)">
        <svg class="mic-svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
        <svg class="stop-svg" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2.5"/>
        </svg>
      </button>
    </div>
    <canvas class="wave-canvas" id="wave" width="600" height="112"></canvas>
  </div>

  <!-- Transcript -->
  <div class="live-box" id="liveBox">
    <div class="live-head">
      <span class="live-label">Transcript <span class="word-count" id="wordCount"></span></span>
      <button class="copy-btn" id="copyBtn" onclick="copyTranscript()" title="Copy transcript">copy</button>
    </div>
    <div class="live-text empty" id="liveText" data-placeholder="Words you speak will appear here.">
      <span id="liveConfirmed"></span><span id="livePartial"></span><span class="live-cursor"></span>
    </div>
  </div>

  <!-- Status message -->
  <div class="msg" id="msg">Tap the mic and speak — text types into the focused app.</div>

  <!-- Language pills -->
  <div class="lang-section">
    <div class="lang-rail" id="langRail"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="model-tag" id="modelTag">loading…</span>
    <span class="hotkey-tag"><span id="versionTag"></span><b>Ctrl+Shift+V</b></span>
  </div>

</div>

<!-- Mini bar — a small floating dock; dictates into whatever field is focused
     elsewhere, without needing the full window open -->
<div class="mini-view" id="miniView">
  <div class="mini-dot" id="miniDot"></div>
  <button class="mini-mic" id="miniMicBtn" onclick="toggleListen()" title="Start or stop dictation (Ctrl+Shift+V)">
    <svg class="mic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
    </svg>
    <svg class="stop-svg" width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
      <rect x="6" y="6" width="12" height="12" rx="2.5"/>
    </svg>
  </button>
  <canvas class="mini-wave" id="miniWave" width="200" height="56"></canvas>
  <span class="mini-timer" id="miniTimer"></span>
  <button class="mini-expand" onclick="toggleCompact()" title="Expand">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/></svg>
  </button>
</div>

</div>

<script>
// ── State ───────────────────────────────────────────────────────────────────
let S = {
  isListening: false,
  language: 'Banglish',
  model: '',
  languages: ['Bangla', 'English', 'Banglish'],
  hints: {},
  theme: 'night',
  compact: false,
};
let confirmedText = '';

// ── Waveform: scrolling level history, rendered into full + mini canvases ──
const CANVASES = [
  document.getElementById('wave').getContext('2d'),
  document.getElementById('miniWave').getContext('2d'),
];
const SLOTS = 56;
let history = new Array(SLOTS).fill(0);
let displayLevel = 0;   // smoothed level for ring + bars
let rawLevel = 0;       // last RMS from Python
let waveRaf = null;
let lastPush = 0;

// Canvas colors re-read on theme switch
const P = {};
function refreshPalette() {
  const cs = getComputedStyle(document.documentElement);
  P.jade  = cs.getPropertyValue('--jade').trim()       || '#3dd68c';
  P.rec   = cs.getPropertyValue('--rec').trim()        || '#f2555a';
  P.faint = cs.getPropertyValue('--wave-faint').trim() || 'rgba(255,255,255,0.10)';
}
refreshPalette();

function renderWaveInto(ctx) {
  const W = ctx.canvas.width, H = ctx.canvas.height, mid = H / 2;
  ctx.clearRect(0, 0, W, H);
  const slotW = W / SLOTS, barW = slotW * 0.55;
  const color = S.isListening ? P.rec : P.jade;
  for (let i = 0; i < SLOTS; i++) {
    const v = history[i];
    const h = Math.max(2, v * (H / 2 - 4));
    const x = i * slotW + (slotW - barW) / 2;
    const age = i / SLOTS;                       // older bars fade left
    ctx.fillStyle = v > 0.02 ? color : P.faint;
    ctx.globalAlpha = v > 0.02 ? 0.25 + 0.75 * age : 0.6;
    ctx.beginPath();
    ctx.roundRect(x, mid - h, barW, h * 2, barW / 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawWave() { CANVASES.forEach(renderWaveInto); }

// Breathing baseline while idle with no last take — a recorder at rest
let idleRaf = null;
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

function idleTickInto(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height, mid = H / 2;
  ctx.clearRect(0, 0, W, H);
  const slotW = W / SLOTS, barW = slotW * 0.55;
  ctx.fillStyle = P.faint;
  for (let i = 0; i < SLOTS; i++) {
    const breath = 2 + 2.2 * (1 + Math.sin(t / 1400)) * Math.abs(Math.sin(i * 0.22 + t / 900));
    const x = i * slotW + (slotW - barW) / 2;
    ctx.beginPath();
    ctx.roundRect(x, mid - breath, barW, breath * 2, barW / 2);
    ctx.fill();
  }
}

function idleTick(t) {
  CANVASES.forEach(ctx => idleTickInto(ctx, t));
  idleRaf = requestAnimationFrame(idleTick);
}

function startIdleWave() {
  cancelAnimationFrame(idleRaf);
  const hasTrace = history.some(v => v > 0.02);
  if (hasTrace || REDUCED_MOTION) { drawWave(); return; }  // keep last take frozen
  idleRaf = requestAnimationFrame(idleTick);
}

function waveTick(t) {
  // Perceptual scaling: sqrt lifts quiet speech into visible range
  const target = Math.min(1, Math.sqrt(rawLevel) * 2.4);
  displayLevel = target > displayLevel ? target : displayLevel * 0.88;
  if (t - lastPush > 70) {                       // scroll speed ≈14 slots/s
    history.push(displayLevel);
    history.shift();
    lastPush = t;
  }
  setRing(displayLevel);
  drawWave();
  if (S.isListening) waveRaf = requestAnimationFrame(waveTick);
}

function setRing(level) {
  const CIRC = 377;                              // 2πr, r=60
  document.getElementById('ringFill').style.strokeDashoffset =
    CIRC * (1 - Math.min(1, level));
}

function onLevel(rms) { rawLevel = rms; }

// ── Timer ───────────────────────────────────────────────────────────────────
let timerInterval = null, timerStart = 0;
function startTimer() {
  timerStart = Date.now();
  const el = document.getElementById('timer');
  el.classList.add('on');
  el.textContent = '00:00';
  document.getElementById('miniTimer').textContent = '00:00';
  timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - timerStart) / 1000);
    const text = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    el.textContent = text;
    document.getElementById('miniTimer').textContent = text;
  }, 500);
}
function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  document.getElementById('timer').classList.remove('on');
  document.getElementById('miniTimer').textContent = '';
}

// ── Live transcript ─────────────────────────────────────────────────────────
function refreshLiveEmpty() {
  const hasText = confirmedText || document.getElementById('livePartial').textContent;
  document.getElementById('liveText').classList.toggle('empty', !hasText);
  const words = confirmedText.trim() ? confirmedText.trim().split(/\s+/).length : 0;
  document.getElementById('wordCount').textContent = words ? `· ${words} words` : '';
}

function onPartial(text) {
  document.getElementById('livePartial').textContent = text ? (confirmedText ? ' ' : '') + text : '';
  refreshLiveEmpty();
  const box = document.getElementById('liveText');
  box.scrollTop = box.scrollHeight;
}

function onTyped(text) {
  const seg = document.createElement('span');
  seg.className = 'seg';
  seg.textContent = (confirmedText ? ' ' : '') + text;
  confirmedText += (confirmedText ? ' ' : '') + text;
  document.getElementById('liveConfirmed').appendChild(seg);
  document.getElementById('livePartial').textContent = '';
  refreshLiveEmpty();
  const box = document.getElementById('liveText');
  box.scrollTop = box.scrollHeight;
}

function resetLive() {
  confirmedText = '';
  document.getElementById('liveConfirmed').textContent = '';
  document.getElementById('livePartial').textContent = '';
  refreshLiveEmpty();
}

function copyTranscript() {
  const text = confirmedText.trim();
  const btn = document.getElementById('copyBtn');
  if (!text) return;
  const done = () => {
    btn.classList.add('ok'); btn.textContent = 'copied';
    setTimeout(() => { btn.classList.remove('ok'); btn.textContent = 'copy'; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  ta.remove();
}

// ── Python callbacks ────────────────────────────────────────────────────────
function onAutoStop(result) {
  S.isListening = false;
  setIdleUI();
  if (result.success && result.text) {
    setStatus('Done', 'done');
    setMsg(`Typed: "${result.text}"`, 'success');
  } else if (result.success) {
    setMsg('Stopped after silence — no speech detected.');
  } else {
    setStatus('Error', 'error');
    setMsg(result.error || 'Something went wrong while stopping.', 'error');
  }
}

function onError(message) {
  S.isListening = false;
  setIdleUI();
  setStatus('Error', 'error');
  setMsg(message, 'error');
}

// ── UI helpers ──────────────────────────────────────────────────────────────
function setStatus(label, type = '') {
  document.getElementById('dot').className        = 'dot'         + (type ? ' ' + type : '');
  document.getElementById('statusText').className = 'status-text' + (type ? ' ' + type : '');
  document.getElementById('statusText').textContent = label;
  document.getElementById('miniDot').className = 'mini-dot' + (type ? ' ' + type : '');
}

function setMsg(text, type = '') {
  const el = document.getElementById('msg');
  if (el.textContent === text) return;
  el.className   = 'msg' + (type ? ' ' + type : '');
  el.textContent = text;
  if (!REDUCED_MOTION) {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = 'msg-in 0.45s ease';
  }
}

// Native-script labels — the API keeps English values
const LANG_LABELS = { 'Bangla': 'বাংলা', 'English': 'English', 'Banglish': 'বাংলিশ' };

function buildPills() {
  const rail = document.getElementById('langRail');
  rail.innerHTML = '';
  for (const lang of S.languages) {
    const btn = document.createElement('button');
    btn.className = 'lang-pill' + (lang === S.language ? ' active' : '');
    btn.textContent = LANG_LABELS[lang] || lang;
    btn.title = lang;
    btn.disabled = S.isListening;
    btn.onclick = () => pickLang(lang);
    rail.appendChild(btn);
  }
}

function setListeningUI() {
  document.getElementById('micWrap').classList.add('listening');
  document.getElementById('miniView').classList.add('listening');
  document.getElementById('liveBox').classList.add('recording');
  resetLive();
  history.fill(0);
  rawLevel = 0; displayLevel = 0;
  startTimer();
  setStatus('Recording', 'listening');
  setMsg(`Speak now — ${S.language} mode. Pause to stop automatically.`);
  buildPills();
  cancelAnimationFrame(idleRaf);
  cancelAnimationFrame(waveRaf);
  waveRaf = requestAnimationFrame(waveTick);
}

function setIdleUI() {
  document.getElementById('micWrap').classList.remove('listening');
  document.getElementById('miniView').classList.remove('listening');
  document.getElementById('liveBox').classList.remove('recording');
  document.getElementById('livePartial').textContent = '';
  refreshLiveEmpty();
  stopTimer();
  cancelAnimationFrame(waveRaf);
  setRing(0);
  startIdleWave();
  setStatus('Ready');
  buildPills();
}

// ── Rotating idle tips — teach the invisible features ───────────────────────
const TIPS = [
  'Press Ctrl+Shift+V from any app to start or stop.',
  'Say "comma", "full stop" or "question mark" to punctuate.',
  'Say "new line" to start a new line.',
  'Pause for a moment — Kothon stops by itself.',
];
let tipIdx = 0;
setInterval(() => {
  if (S.isListening || !window.pywebview) return;
  tipIdx = (tipIdx + 1) % TIPS.length;
  setMsg(TIPS[tipIdx]);
}, 7000);

// ── Actions ─────────────────────────────────────────────────────────────────
async function toggleListen() {
  if (!window.pywebview) return;   // hotkey can fire before the bridge is ready
  if (S.isListening) { await stopListen(); } else { await startListen(); }
}

// ── Theme ───────────────────────────────────────────────────────────────────
function applyTheme(theme) {
  S.theme = theme;
  document.documentElement.dataset.theme = theme;
  refreshPalette();
  drawWave();
}

async function toggleTheme() {
  const next = S.theme === 'day' ? 'night' : 'day';
  applyTheme(next);
  if (window.pywebview) {
    try { await window.pywebview.api.set_theme(next); } catch (e) {}
  }
}

// ── Compact mini bar ─────────────────────────────────────────────────────────
function applyCompact(isCompact) {
  S.compact = isCompact;
  document.getElementById('appRoot').classList.toggle('compact', isCompact);
}

async function toggleCompact() {
  const next = !S.compact;
  applyCompact(next);
  if (window.pywebview) {
    try { await window.pywebview.api.set_compact(next); } catch (e) {}
  }
}

async function startListen() {
  const r = await window.pywebview.api.start_listening();
  if (r.success) {
    S.isListening = true;
    setListeningUI();
  } else {
    setStatus('Error', 'error');
    setMsg(r.error || 'Could not open the microphone.', 'error');
  }
}

async function stopListen() {
  S.isListening = false;
  setIdleUI();
  setStatus('Processing', 'busy');
  setMsg('Finishing up…');
  const r = await window.pywebview.api.stop_listening();
  if (r.success) {
    if (r.text) {
      setStatus('Done', 'done');
      setMsg(`Typed: "${r.text}"`, 'success');
    } else {
      setStatus('Ready');
      setMsg('No speech detected — try again a little closer to the mic.');
    }
  } else {
    setStatus('Error', 'error');
    setMsg(r.error || 'Something went wrong.', 'error');
  }
}

async function pickLang(lang) {
  if (S.isListening || lang === S.language) return;
  const r = await window.pywebview.api.set_language(lang);
  if (r.success) {
    S.language = lang;
    S.model    = r.model;
    document.getElementById('modelTag').textContent = r.model;
    buildPills();
    setMsg(S.hints[lang] || '');
  } else {
    setMsg(r.error || 'Could not switch language.', 'error');
  }
}

async function minWin()   { await window.pywebview.api.minimize_window(); }
async function closeWin() { await window.pywebview.api.close_app(); }

// Space toggles recording when the window itself is focused
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) {
    e.preventDefault();
    toggleListen();
  }
});

// ── Init ────────────────────────────────────────────────────────────────────
async function init() {
  startIdleWave();
  await new Promise(resolve => {
    if (window.pywebview) resolve();
    else window.addEventListener('pywebviewready', resolve);
  });
  const s = await window.pywebview.api.get_state();
  S = { ...S, ...s };
  applyTheme(S.theme);
  applyCompact(S.compact);
  if (S.version) {
    document.getElementById('versionTag').textContent = `v${S.version} · `;
  }
  document.getElementById('modelTag').textContent = S.model;
  buildPills();
  setMsg(S.hints[S.language] || 'Tap the mic and speak — text types into the focused app.');
}

init();
</script>
